<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Góc phố Anh Em SCA</title>
<meta name="theme-color" content="#E9B93A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{--wall:#E9B93A;--door:#2F6B55;--stool:#C8352E;--cream:#FFF4D6;--ink:#33241A;--sign:#234E9B}
*{box-sizing:border-box}
body{margin:0;font:400 17px/1.65 "Be Vietnam Pro",system-ui,sans-serif;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- Trang chính ---------- */
body.home{background:#2a1c12;min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden}
.stage{width:min(980px,100%)}
.photo{position:relative;aspect-ratio:612/490;border-radius:14px;box-shadow:0 18px 50px #0008}
.photo img{width:100%;height:100%;display:block;border-radius:14px}
.hint{text-align:center;color:#f3dfae;margin:16px 0 0;font-size:15px}

.hot{position:absolute;left:calc(var(--l)*1%);top:calc(var(--t)*1%);width:calc(var(--w)*1%);height:calc(var(--h)*1%);
  background-image:var(--img);
  background-size:calc(10000% / var(--w)) calc(10000% / var(--h));
  background-position:calc(var(--l) / (100 - var(--w)) * 100%) calc(var(--t) / (100 - var(--h)) * 100%);
  border:0;padding:0;border-radius:10px;cursor:pointer;opacity:0;transition:opacity .15s;text-decoration:none}
.hot::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:var(--cream);color:var(--ink);font:600 14px "Be Vietnam Pro",sans-serif;padding:4px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 10px #0006}
.hot:hover,.hot:focus-visible,.hot.on{opacity:1;z-index:2;box-shadow:0 0 0 3px #fff3b0,0 0 28px 8px rgba(255,214,90,.85);animation:rung .45s ease-in-out infinite}
.hot.on:not(:hover):not(:focus-visible){animation-iteration-count:2}
@keyframes rung{0%,100%{transform:rotate(0)}20%{transform:rotate(-1.6deg) translateX(-2px)}40%{transform:rotate(1.6deg) translateX(2px)}60%{transform:rotate(-1deg)}80%{transform:rotate(1deg)}}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--cream);color:var(--ink);padding:10px 20px;border-radius:8px;border:2px solid var(--ink);opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Trang con ---------- */
body.sub{background:var(--wall)}
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--door) 0 36px,var(--cream) 36px 72px);border-bottom:6px solid #1f4a3a}
.page{width:min(720px,100% - 32px);margin:28px auto 60px}
.back{display:block;width:fit-content;margin:0 0 18px;color:var(--ink);font-weight:600}
.plate{display:inline-block;background:#fff;color:var(--sign);border:6px solid var(--sign);outline:3px solid #fff;outline-offset:-10px;border-radius:10px;
  padding:10px 28px;margin:0 0 20px;font:800 clamp(26px,5vw,40px)/1.15 "Playfair Display",Georgia,serif}
.paper{background:var(--cream);border:2px solid var(--ink);border-radius:4px;padding:20px 24px;margin:0 0 20px}
.paper h2{margin:0 0 8px;font:800 22px/1.3 "Playfair Display",Georgia,serif}
.paper ol,.paper ul{margin:0;padding-left:22px}
.paper dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.paper dt{font-weight:600}.paper dd{margin:0}
.fill{background:#fff;color:#b3261e;padding:0 5px;border-radius:3px;font-weight:600}
.chalk{background:#22302a;color:#f4f1e6;border:10px solid #8a5a2b;border-radius:6px;padding:22px 26px;margin:0 0 20px}
.chalk h2{margin:0 0 10px;font:800 26px/1.2 "Playfair Display",Georgia,serif}
.chalk ul{list-style:none;margin:0;padding:0}
.chalk li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:2px dashed #f4f1e655}
.chalk li:last-child{border-bottom:0}
.chalk .fill{background:transparent;color:#ffd9a0}
.timeline{list-style:none;padding:0!important}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-bottom:1px dashed #33241a66}
.timeline li:last-child{border-bottom:0}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.nav a{background:var(--door);color:#fff;text-decoration:none;font-weight:600;padding:8px 18px;border-radius:999px}
.nav a:hover{background:#245443}

@media (prefers-reduced-motion:reduce){.hot,.toast{transition:none}.hot:hover,.hot:focus-visible,.hot.on{animation:none}}
@media (max-width:520px){body{font-size:16px}.timeline li{grid-template-columns:1fr;gap:2px}.hot::after{font-size:12px;padding:3px 8px}}

</style>
</head>

<script>
(function () {
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var toast = document.getElementById('toast');
  var timer;

  function wiggle(el, ms) {
    el.classList.add('on');
    setTimeout(function () { el.classList.remove('on'); }, ms || 700);
  }

  // Một lần khi mở trang: 3 khu chính rung lần lượt để gợi ý bấm
  if (!calm) {
    document.querySelectorAll('.hot.main').forEach(function (el, i) {
      setTimeout(function () { wiggle(el, 700); }, 700 + i * 600);
    });
  }

  // Khu chính: rung rồi sang trang con
  document.querySelectorAll('.hot.main').forEach(function (el) {
    el.addEventListener('click', function (e) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || calm) return;
      e.preventDefault();
      wiggle(el, 500);
      setTimeout(function () { location.href = el.getAttribute('href'); }, 450);
    });
  });

  // Vật phụ: rung và hiện một dòng chữ
  document.querySelectorAll('.hot.deco').forEach(function (el) {
    el.addEventListener('click', function () {
      wiggle(el, 700);
      toast.textContent = el.dataset.msg;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove('show'); }, 2800);
    });
  });
})();

</script>
